<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Calendar</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --accent: #58a6ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --holiday-red: #ff7b72;
            --weekend-color: #f0883e;
            --border: #30363d;
            --bn-color: #7ee787;
            --ar-color: #d2a8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 32px;
            filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.4));
        }

        .title-group h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .title-group .author {
            font-size: 11px;
            color: var(--accent);
            font-weight: 500;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        select, button {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, button:hover {
            border-color: var(--accent);
        }

        .btn-today {
            background-color: var(--accent);
            color: #0d1117;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 15px;
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .calendar-section {
            background-color: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .month-header h2 {
            font-size: 22px;
            color: #ffffff;
        }

        .nav-btns {
            display: flex;
            gap: 5px;
        }

        .nav-btn {
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #21262d;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 13px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            flex: 1;
        }

        .day-cell {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 90px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.1s, border-color 0.2s;
        }

        .day-cell:hover {
            border-color: var(--accent);
            background-color: var(--bg-hover);
        }

        .day-cell.today {
            border: 2px solid var(--accent);
            background-color: rgba(88, 166, 255, 0.08);
        }

        .day-cell.other-month {
            opacity: 0.35;
        }

        .day-header-num {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .eng-num {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .day-cell.weekend .eng-num {
            color: var(--weekend-color);
        }

        .sub-dates {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 4px;
            font-weight: 600;
        }

        .bn-date { color: var(--bn-color); }
        .ar-date { color: var(--ar-color); }

        .holiday-tag {
            font-size: 10px;
            background-color: rgba(255, 123, 114, 0.15);
            color: var(--holiday-red);
            border-left: 3px solid var(--holiday-red);
            padding: 2px 4px;
            border-radius: 2px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar {
            background-color: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            max-height: 650px;
        }

        .sidebar h3 {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .holiday-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .holiday-item {
            background: #21262d;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .holiday-item.national {
            border-left-color: var(--holiday-red);
        }

        .holiday-item .date-str {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .holiday-item .name-str {
            font-size: 13px;
            color: #fff;
            font-weight: 600;
        }

        .legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo">🌙</div>
            <div class="title-group">
                <h1 id="ui-app-title">RB Calendar</h1>
                <div class="author" id="ui-author">By Rafsan</div>
            </div>
        </div>

        <div class="controls">
            <select id="countrySelect" onchange="onCountryOrYearChange()">
                <option value="BD" selected>🇧🇩 Bangladesh</option>
                <option value="US">🇺🇸 United States</option>
                <option value="GB">🇬🇧 United Kingdom</option>
                <option value="SA">🇸🇦 Saudi Arabia</option>
                <option value="IN">🇮🇳 India</option>
            </select>

            <select id="langSelect" onchange="onLanguageChange()">
                <option value="bn" selected>বাংলা</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>

            <select id="yearSelect" onchange="onCountryOrYearChange()"></select>
            <select id="monthSelect" onchange="renderCalendar()"></select>
            <button class="btn-today" id="ui-today-btn" onclick="goToToday()">আজ</button>
        </div>
    </header>

    <div class="main-container">
        <div class="calendar-section">
            <div class="month-header">
                <h2 id="monthYearTitle"></h2>
                <div class="nav-btns">
                    <button class="nav-btn" onclick="prevMonth()">&lt;</button>
                    <button class="nav-btn" onclick="nextMonth()">&gt;</button>
                </div>
            </div>

            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="daysGrid"></div>

            <div class="legend" id="legendBox">
                <div class="legend-item"><div class="dot" style="background: var(--holiday-red);"></div> <span id="ui-leg-holiday">ছুটি</span></div>
                <div class="legend-item"><div class="dot" style="background: var(--weekend-color);"></div> <span id="ui-leg-weekend">সাপ্তাহিক ছুটি</span></div>
                <div class="legend-item" id="bdLegend1"><div class="dot" style="background: var(--bn-color);"></div> <span id="ui-leg-bangla">বাংলা তারিখ</span></div>
                <div class="legend-item" id="bdLegend2"><div class="dot" style="background: var(--ar-color);"></div> <span id="ui-leg-arabic">হিজরি তারিখ</span></div>
            </div>
        </div>

        <div class="sidebar">
            <h3>
                <span id="ui-sidebar-title">বার্ষিক ছুটির তালিকা</span>
                <span id="chartYearBadge" style="font-size: 12px; color: var(--accent);">2026</span>
            </h3>
            <div class="holiday-list" id="holidayList"></div>
        </div>
    </div>

    <script>
        const i18n = {
            bn: {
                appTitle: "আরবি ক্যালেন্ডার",
                author: "রাফসান দ্বারা তৈরি",
                todayBtn: "আজ",
                holiday: "ছুটি",
                weekend: "সাপ্তাহিক ছুটি",
                banglaDate: "বাংলা তারিখ",
                arabicDate: "হিজরি তারিখ",
                sidebarTitle: "বার্ষিক ছুটির তালিকা",
                nationalTag: "জাতীয়",
                months: ["জানুয়ারী","ফেব্রুয়ারী","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"],
                weekdays: ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"],
                holidays: {
                    "02-21": "শহীদ দিবস ও আন্তর্জাতিক মাতৃভাষা দিবস",
                    "03-17": "বঙ্গবন্ধুর জন্মবার্ষিকী",
                    "03-26": "স্বাধীনতা দিবস",
                    "04-14": "পহেলা বৈশাখ",
                    "05-01": "মে দিবস",
                    "08-05": "জুলাই বিপ্লব দিবস",
                    "08-15": "জাতীয় শোক দিবস",
                    "12-16": "বিজয় দিবস",
                    "12-25": "বড়দিন"
                }
            },
            en: {
                appTitle: "RB Calendar",
                author: "By Rafsan",
                todayBtn: "Today",
                holiday: "Holiday",
                weekend: "Weekend",
                banglaDate: "Bangla Date",
                arabicDate: "Arabic Date",
                sidebarTitle: "Yearly Holidays Chart",
                nationalTag: "National",
                months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
                weekdays: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
                holidays: {
                    "02-21": "Language Martyrs' Day",
                    "03-17": "Bangabandhu Birthday",
                    "03-26": "Independence Day",
                    "04-14": "Pohela Boishakh",
                    "05-01": "May Day",
                    "08-05": "July Uprising Day",
                    "08-15": "National Mourning Day",
                    "12-16": "Victory Day",
                    "12-25": "Christmas Day"
                }
            },
            ar: {
                appTitle: "تقويم RB",
                author: "بواسطة رفشان",
                todayBtn: "اليوم",
                holiday: "عطلة",
                weekend: "عطلة نهاية الأسبوع",
                banglaDate: "التاريخ البنغالي",
                arabicDate: "التاريخ الهجري",
                sidebarTitle: "قائمة العطلات السنوية",
                nationalTag: "وطني",
                months: ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],
                weekdays: ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],
                holidays: {
                    "02-21": "يوم لغة الأم",
                    "03-26": "يوم الاستقلال",
                    "05-01": "عيد العمال",
                    "12-16": "يوم النصر",
                    "12-25": "عيد الميلاد"
                }
            }
        };

        const countryHolidays = {
            BD: { weekends: [5, 6] },
            US: { weekends: [0, 6] },
            SA: { weekends: [5, 6] },
            IN: { weekends: [0, 6] },
            GB: { weekends: [0, 6] }
        };

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();

        function convertNum(num, lang) {
            if (lang === 'bn') {
                const bnNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
                return String(num).split('').map(d => bnNums[d] || d).join('');
            }
            if (lang === 'ar') {
                const arNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
                return String(num).split('').map(d => arNums[d] || d).join('');
            }
            return num;
        }

        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2014; y <= 2060; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y;
            if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        function populateMonths() {
            const monthSelect = document.getElementById('monthSelect');
            monthSelect.innerHTML = '';
            const lang = document.getElementById('langSelect').value;
            const dict = i18n[lang] || i18n.bn;

            dict.months.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = m;
                if (idx === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            });
        }

        function updateStaticUI() {
            const lang = document.getElementById('langSelect').value;
            const dict = i18n[lang] || i18n.bn;

            document.getElementById('ui-app-title').innerText = dict.appTitle;
            document.getElementById('ui-author').innerText = dict.author;
            document.getElementById('ui-today-btn').innerText = dict.todayBtn;
            document.getElementById('ui-leg-holiday').innerText = dict.holiday;
            document.getElementById('ui-leg-weekend').innerText = dict.weekend;
            document.getElementById('ui-leg-bangla').innerText = dict.banglaDate;
            document.getElementById('ui-leg-arabic').innerText = dict.arabicDate;
            document.getElementById('ui-sidebar-title').innerText = dict.sidebarTitle;
        }

        function onLanguageChange() {
            updateStaticUI();
            populateMonths();
            renderCalendar();
        }

        function goToToday() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            document.getElementById('yearSelect').value = currentYear;
            populateMonths();
            renderCalendar();
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            document.getElementById('yearSelect').value = currentYear;
            document.getElementById('monthSelect').value = currentMonth;
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            document.getElementById('yearSelect').value = currentYear;
            document.getElementById('monthSelect').value = currentMonth;
            renderCalendar();
        }

        function onCountryOrYearChange() {
            currentYear = parseInt(document.getElementById('yearSelect').value);
            currentMonth = parseInt(document.getElementById('monthSelect').value || currentMonth);
            renderCalendar();
        }

        function getBengaliDate(date) {
            const day = date.getDate();
            let bnDay = day - 13;
            if (bnDay <= 0) bnDay += 30;
            return convertNum(bnDay, 'bn');
        }

        function getArabicDate(date) {
            try {
                const formatter = new Intl.DateTimeFormat('ar-TN-u-ca-islamic-uma', { day: 'numeric' });
                return formatter.format(date);
            } catch(e) {
                return date.getDate();
            }
        }

        function renderCalendar() {
            const lang = document.getElementById('langSelect').value;
            const country = document.getElementById('countrySelect').value;
            currentYear = parseInt(document.getElementById('yearSelect').value);
            currentMonth = parseInt(document.getElementById('monthSelect').value);

            const dict = i18n[lang] || i18n.bn;
            const countryData = countryHolidays[country] || countryHolidays.BD;

            if (country === 'BD') {
                document.getElementById('bdLegend1').style.display = 'flex';
                document.getElementById('bdLegend2').style.display = 'flex';
            } else {
                document.getElementById('bdLegend1').style.display = 'none';
                document.getElementById('bdLegend2').style.display = 'none';
            }

            document.getElementById('monthYearTitle').innerText = `${dict.months[currentMonth]} ${convertNum(currentYear, lang)}`;

            const weekdaysContainer = document.getElementById('weekdays');
            weekdaysContainer.innerHTML = '';
            dict.weekdays.forEach((day, idx) => {
                const div = document.createElement('div');
                div.innerText = day;
                if (countryData.weekends.includes(idx)) div.style.color = 'var(--weekend-color)';
                weekdaysContainer.appendChild(div);
            });

            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevMonthTotalDays = new Date(currentYear, currentMonth, 0).getDate();
            const today = new Date();

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const prevDay = prevMonthTotalDays - i;
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.innerHTML = `<div class="eng-num">${convertNum(prevDay, lang)}</div>`;
                daysGrid.appendChild(cell);
            }

            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(currentYear, currentMonth, d);
                const dayOfWeek = dateObj.getDay();
                const mm = String(currentMonth + 1).padStart(2, '0');
                const dd = String(d).padStart(2, '0');
                const dateKey = `${mm}-${dd}`;

                const cell = document.createElement('div');
                cell.className = 'day-cell';

                if (today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d) {
                    cell.classList.add('today');
                }

                const isWeekend = countryData.weekends.includes(dayOfWeek);
                if (isWeekend) cell.classList.add('weekend');

                const holidayName = dict.holidays[dateKey];

                let subDatesHtml = '';
                if (country === 'BD') {
                    const bn = getBengaliDate(dateObj);
                    const ar = getArabicDate(dateObj);
                    subDatesHtml = `<div class="sub-dates"><span class="bn-date">${bn}</span><span class="ar-date">${ar}</span></div>`;
                }

                let holidayHtml = '';
                if (holidayName) {
                    holidayHtml = `<div class="holiday-tag">${holidayName}</div>`;
                } else if (isWeekend) {
                    holidayHtml = `<div class="holiday-tag" style="background: rgba(240, 136, 62, 0.15); color: var(--weekend-color); border-left-color: var(--weekend-color);">${dict.weekend}</div>`;
                }

                cell.innerHTML = `
                    <div>
                        <div class="day-header-num"><span class="eng-num">${convertNum(d, lang)}</span></div>
                        ${subDatesHtml}
                    </div>
                    ${holidayHtml}
                `;
                daysGrid.appendChild(cell);
            }

            const totalCells = firstDayIndex + totalDays;
            const nextPadding = (7 - (totalCells % 7)) % 7;
            for (let n = 1; n <= nextPadding; n++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.innerHTML = `<div class="eng-num">${convertNum(n, lang)}</div>`;
                daysGrid.appendChild(cell);
            }

            renderHolidayChart();
        }

        function renderHolidayChart() {
            const lang = document.getElementById('langSelect').value;
            const year = parseInt(document.getElementById('yearSelect').value);
            document.getElementById('chartYearBadge').innerText = convertNum(year, lang);

            const dict = i18n[lang] || i18n.bn;
            const listContainer = document.getElementById('holidayList');
            listContainer.innerHTML = '';

            Object.keys(dict.holidays).sort().forEach(dateKey => {
                const [mm, dd] = dateKey.split('-').map(Number);
                const monthName = dict.months[mm - 1];
                const holidayName = dict.holidays[dateKey];

                const item = document.createElement('div');
                item.className = 'holiday-item national';
                item.innerHTML = `
                    <div>
                        <div class="name-str">${holidayName}</div>
                        <div class="date-str">${convertNum(dd, lang)} ${monthName}, ${convertNum(year, lang)}</div>
                    </div>
                    <span style="font-size: 10px; padding: 2px 6px; background: rgba(255,123,114,0.2); color: var(--holiday-red); border-radius: 4px;">${dict.nationalTag}</span>
                `;
                listContainer.appendChild(item);
            });
        }

        updateStaticUI();
        populateMonths();
        renderCalendar();
    </script>
</body>
  
</html>
