<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB - Universal Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amberCustom: '#fbbf24',
                        bnBlue: '#60a5fa',
                        arGreen: '#34d399'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
    </style>
</head>
<body class="p-2 sm:p-6 flex flex-col items-center justify-center min-h-screen">

    <!-- Header Section -->
    <header class="w-full max-w-4xl flex items-center justify-between mb-4 glass-panel p-4 rounded-2xl">
        <div class="flex items-center gap-3">
            <div class="text-3xl sm:text-4xl filter drop-shadow-[0_0_10px_rgba(251,191,36,0.5)]">🌙</div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-amberCustom">RB</h1>
                <p class="text-[9px] sm:text-[10px] font-bold tracking-[0.2em] text-slate-400 uppercase">UNIVERSAL CALENDAR • BY RAFSAN</p>
            </div>
        </div>
        <div id="liveClock" class="text-right hidden sm:block">
            <div class="text-xs font-semibold text-slate-400" id="currentDateText">--</div>
            <div class="text-base font-bold text-amberCustom" id="currentTimeText">--</div>
        </div>
    </header>

    <!-- Main Calendar -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-3 sm:p-6">
        
        <!-- Controls -->
        <div class="flex items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2">
                <button onclick="prevMonth()" class="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center bg-slate-800 hover:bg-amberCustom hover:text-slate-950 rounded-xl border border-slate-700 font-bold transition text-sm">❮</button>
                <h2 id="monthYearText" class="text-lg sm:text-2xl font-black min-w-[130px] sm:min-w-[200px] text-center text-amberCustom">August 2026</h2>
                <button onclick="nextMonth()" class="w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center bg-slate-800 hover:bg-amberCustom hover:text-slate-950 rounded-xl border border-slate-700 font-bold transition text-sm">❯</button>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="goToToday()" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition">Today</button>
                <select id="yearSelect" onchange="selectYear(this.value)" class="bg-slate-900 text-xs sm:text-sm border border-slate-700 rounded-xl px-2 py-1.5 font-bold text-slate-200 outline-none focus:border-amberCustom">
                </select>
            </div>
        </div>

        <!-- Weekdays Header -->
        <div class="calendar-grid gap-1 sm:gap-2 mb-2 text-center text-[10px] sm:text-xs font-bold text-slate-400">
            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div class="text-rose-400">FRI</div><div>SAT</div>
        </div>

        <!-- Calendar Days Grid -->
        <div id="daysGrid" class="calendar-grid gap-1 sm:gap-2"></div>
    </main>

    <script>
        let currentYear = 2026;
        let currentMonth = 7;

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        window.onload = () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            
            populateYears();
            renderCalendar();
            startClock();
        };

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('currentDateText').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                document.getElementById('currentTimeText').textContent = now.toLocaleTimeString();
            }, 1000);
        }

        function populateYears() {
            const select = document.getElementById('yearSelect');
            select.innerHTML = '';
            for (let y = 2014; y <= 2060; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function renderCalendar() {
            document.getElementById('monthYearText').textContent = `${months[currentMonth]} ${currentYear}`;
            document.getElementById('yearSelect').value = currentYear;
            
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = "min-h-[65px] sm:min-h-[80px] rounded-xl glass-card opacity-20";
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayCard = document.createElement('div');
                const isToday = today.getDate() === day && today.getMonth() === currentMonth && today.getFullYear() === currentYear;
                
                dayCard.className = `min-h-[68px] sm:min-h-[80px] p-1.5 sm:p-2.5 rounded-xl flex flex-col justify-between glass-card border transition ${
                    isToday ? 'border-amberCustom bg-amberCustom/10 shadow-[0_0_15px_rgba(251,191,36,0.2)]' : 'border-slate-800 hover:border-slate-700'
                }`;

                const bnDay = ((day + 16) % 30) || 30;
                const hjDay = ((day + 12) % 29) || 29;

                dayCard.innerHTML = `
                    <div class="flex items-center justify-between leading-none">
                        <span class="font-black text-sm sm:text-lg ${isToday ? 'text-amberCustom' : 'text-slate-100'}">${day}</span>
                        ${isToday ? '<span class="text-[7px] sm:text-[9px] bg-amberCustom text-slate-950 px-1 py-0.5 rounded font-black">TODAY</span>' : ''}
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between text-[8px] sm:text-[10px] font-semibold pt-1 border-t border-slate-800/80 gap-0.5 leading-tight">
                        <span class="text-bnBlue">বাংলা ${bnDay}</span>
                        <span class="text-arGreen">হিজরী ${hjDay}</span>
                    </div>
                `;
                grid.appendChild(dayCard);
            }
        }

        function prevMonth() {
            if (currentMonth === 0) { currentMonth = 11; currentYear--; } else { currentMonth--; }
            renderCalendar();
        }

        function nextMonth() {
            if (currentMonth === 11) { currentMonth = 0; currentYear++; } else { currentMonth++; }
            renderCalendar();
        }

        function selectYear(yr) {
            currentYear = parseInt(yr);
            renderCalendar();
        }

        function goToToday() {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar();
        }
    </script>
</body>
</html>
