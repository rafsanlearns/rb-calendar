<style>
  :root{
    --bg-0:#0a0f1e;
    --bg-1:#0e1626;
    --bg-2:#141f36;
    --panel:#182548;
    --panel-2:#1c2b52;
    --line: rgba(255,255,255,0.08);
    --ink:#eef2fb;
    --ink-dim:#9aa7c7;
    --gold:#e8b854;
    --gold-soft:#f3d68f;
    --red:#e2564a;
    --green:#4fae6d;
    --blue:#6fa3e0;
    --radius:16px;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,184,84,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(111,163,224,0.12), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    position:relative;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:0.5;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
  @media (prefers-reduced-motion: reduce){ .star{animation:none;opacity:.35;} }

  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:22px 16px 60px;}

  /* Header / logo */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .moon-badge{
    width:58px;height:58px;flex:none;
    filter:drop-shadow(0 0 14px rgba(232,184,84,0.65));
  }
  .moon-badge svg{width:100%;height:100%;display:block;}
  .brand-text .rb{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;letter-spacing:2px;line-height:1;color:var(--ink);}
  .brand-text .by{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-soft);margin-top:3px;}
  .brand-text .tagline{font-size:11px;color:var(--ink-dim);margin-top:2px;}

  .top-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select, input[type="text"], input[type="number"]{
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit;
  }
  select:focus, input:focus{outline:2px solid var(--gold); outline-offset:1px;}

  nav.tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  nav.tabs button{
    background:var(--panel); color:var(--ink-dim); border:1px solid var(--line);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-weight:600;
    transition:all .15s ease;
  }
  nav.tabs button.active{background:linear-gradient(135deg, var(--gold), #c9932f); color:#1a1204; border-color:transparent;}
  nav.tabs button:hover:not(.active){color:var(--ink); border-color:var(--gold);}

  .panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}

  /* Calendar controls row */
  .cal-controls{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .month-nav{display:flex; align-items:center; gap:10px;}
  .month-nav button{background:var(--panel-2); border:1px solid var(--line); color:var(--ink); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:16px;}
  .month-nav button:hover{border-color:var(--gold); color:var(--gold-soft);}
  .month-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; min-width:220px; text-align:center;}
  .sub-date-line{font-size:12px; color:var(--ink-dim); text-align:center; margin-top:2px;}

  .legend{display:flex; gap:14px; font-size:11px; color:var(--ink-dim); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.bn{background:var(--blue);} .dot.ar{background:var(--green);} .dot.hol{background:var(--red);}

  /* Grid */
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .wd{text-align:center; font-size:12px; letter-spacing:1px; color:var(--ink-dim); padding:6px 0; font-weight:700; text-transform:uppercase;}
  .wd.weekend{color:var(--red);}
  .cell{
    background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:12px;
    min-height:84px; padding:8px; position:relative; transition:background .15s;
  }
  .cell.out{opacity:0.28;}
  .cell.today{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .cell:hover{background:rgba(255,255,255,0.05);}
  .g-num{font-size:19px; font-weight:700;}
  .g-num.holiday, .wd.weekend ~ .g-num{color:var(--red);}
  .g-num.weekend{color:var(--red);}
  .sub-nums{display:flex; gap:8px; margin-top:4px; font-size:11px;}
  .sub-nums .bn{color:var(--blue); font-family:'Noto Sans Bengali', sans-serif;}
  .sub-nums .ar{color:var(--green);}
  .hol-name{font-size:9.5px; color:var(--gold-soft); margin-top:4px; line-height:1.2; display:block;}

  /* Holidays list tab */
  .hol-list{display:flex; flex-direction:column; gap:8px;}
  .hol-row{display:flex; align-items:center; gap:14px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px; padding:10px 14px;}
  .hol-date{font-weight:700; color:var(--gold-soft); min-width:110px; font-size:13px;}
  .hol-tag{font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink-dim);}
  .hol-tag.national{color:var(--red); border-color:var(--red);}
  .hol-tag.religious{color:var(--green); border-color:var(--green);}
  .hol-tag.cultural{color:var(--blue); border-color:var(--blue);}

  .world-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
  .country-card{background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .country-card h4{margin:0 0 8px; font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--gold-soft);}
  .country-card ul{margin:0; padding-left:16px; font-size:12.5px; color:var(--ink-dim); line-height:1.7;}

  footer{text-align:center; color:var(--ink-dim); font-size:11px; margin-top:30px; line-height:1.7;}
  footer a{color:var(--gold-soft); text-decoration:none;}

  .note{font-size:11.5px; color:var(--ink-dim); background:rgba(255,255,255,0.03); border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-bottom:14px;}
  .live-badge{font-size:11px; color:var(--ink-dim); margin:-8px 0 16px; display:flex; justify-content:flex-end;}

/* ============================================================
   3. DATE ENGINES — Bengali (reformed calendar) & Hijri (tabular)
   ============================================================ */
const BN_MONTHS = ["Boishakh","Joishtho","Ashar","Srabon","Bhadro","Ashwin","Kartik","Ogrohayon","Poush","Magh","Falgun","Choitro"];
const BN_MONTHS_BN = ["বৈশাখ","জ্যৈষ্ঠ","আষাঢ়","শ্রাবণ","ভাদ্র","আশ্বিন","কার্তিক","অগ্রহায়ণ","পৌষ","মাঘ","ফাল্গুন","চৈত্র"];
const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function toBnDigits(num){ return String(num).split('').map(d=> /[0-9]/.test(d)? BN_DIGITS[+d] : d).join(''); }

function isGregLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }

// Approximate reformed Bangla calendar: Pohela Boishakh = 14 April every Gregorian year.
// Months 1-5 => 31 days, months 6-11 => 30 days, month 12 (Choitro) => 30 or 31 (leap adj).
function gregorianToBengali(date){
  const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
  // Bengali new year starts Apr 14. If date is before Apr 14, it belongs to the Bengali year that started previous April.
  const newYearThisYear = new Date(y,3,14); // Apr 14
  let bnYearStartGregYear = (date >= newYearThisYear) ? y : y-1;
  const bnYear = bnYearStartGregYear - 593; // 2024-593=1431 approx (actual offset ~593/594)
  const start = new Date(bnYearStartGregYear,3,14);
  let dayOfBnYear = Math.floor((date - start)/86400000) + 1; // 1-indexed
  const leapAdj = isGregLeap(bnYearStartGregYear+1) ? 1 : 0; // Falgun gets extra day before a Greg leap Feb
  const lengths = [31,31,31,31,31,30,30,30,30,30,30+leapAdj,30];
  let mi=0, rem=dayOfBnYear;
  while(mi<12 && rem>lengths[mi]){ rem -= lengths[mi]; mi++; }
  if(mi>11) mi=11;
  return {year:bnYear, monthIndex:mi, day:rem, monthName:BN_MONTHS[mi], monthNameBn:BN_MONTHS_BN[mi]};
}

const HIJRI_MONTHS = ["Muharram","Safar","Rabi' al-Awwal","Rabi' al-Thani","Jumada al-Awwal","Jumada al-Thani","Rajab","Sha'ban","Ramadan","Shawwal","Dhu al-Qi'dah","Dhu al-Hijjah"];
const HIJRI_MONTHS_AR = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
// Tabular Islamic calendar (civil), via Julian Day Number — standard algorithm, ±1 day vs real moon sighting.
function gregorianToJDN(y,m,d){
  const a = Math.floor((14-m)/12);
  const yy = y+4800-a;
  const mm = m+12*a-3;
  return d + Math.floor((153*mm+2)/5) + 365*yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) - 32045;
}
function gregorianToHijri(date){
  const jdn = gregorianToJDN(date.getFullYear(), date.getMonth()+1, date.getDate());
  const islamicEpoch = 1948440; // JDN of 1 Muharram 1 AH (civil, Friday-based)
  let l = jdn - islamicEpoch + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  const mi = Math.max(0, Math.min(11, month-1));
  return {year, monthIndex:mi, day, monthName:HIJRI_MONTHS[mi], monthNameAr:HIJRI_MONTHS_AR[mi]};
}

// Marked with * per convention: subject to moon sighting.
const BD_ISLAMIC = {
  2024:[{m:3,d:11,name:"*Start of Ramadan"},{m:4,d:11,name:"*Eid-ul-Fitr"},{m:6,d:17,name:"*Eid-ul-Adha"},{m:7,d:17,name:"*Ashura"},{m:9,d:16,name:"*Eid-e-Milad-un-Nabi"}],
  2025:[{m:3,d:1,name:"*Start of Ramadan"},{m:3,d:31,name:"*Eid-ul-Fitr"},{m:6,d:7,name:"*Eid-ul-Adha"},{m:7,d:6,name:"*Ashura"},{m:9,d:5,name:"*Eid-e-Milad-un-Nabi"}],
  2026:[{m:2,d:19,name:"*Start of Ramadan"},{m:3,d:20,name:"*Eid-ul-Fitr"},{m:5,d:27,name:"*Eid-ul-Adha"},{m:6,d:25,name:"*Ashura"},{m:8,d:26,name:"*Eid-e-Milad-un-Nabi (SM)"}],
  2027:[{m:2,d:9,name:"*Start of Ramadan"},{m:3,d:10,name:"*Eid-ul-Fitr"},{m:5,d:16,name:"*Eid-ul-Adha"},{m:6,d:15,name:"*Ashura"},{m:8,d:15,name:"*Eid-e-Milad-un-Nabi"}],
};

function getBdHolidaysForYear(y){
  const fixed = BD_FIXED.map(h=>({...h, y, type:h.type}));
  const islamic = (BD_ISLAMIC[y]||[]).map(h=>({...h, y, type:"religious"}));
  return [...fixed, ...islamic].sort((a,b)=> a.m-b.m || a.d-b.d);
}

// Other countries — sample recurring fixed-date national holidays (extendable dataset).
const WORLD_HOLIDAYS = {
  US:{flag:"🇺🇸", name:"United States", weekend:[0,6], list:[{m:1,d:1,name:"New Year's Day"},{m:7,d:4,name:"Independence Day"},{m:11,d:11,name:"Veterans Day"},{m:12,d:25,name:"Christmas Day"}]},
  GB:{flag:"🇬🇧", name:"United Kingdom", weekend:[0,6], list:[{m:1,d:1,name:"New Year's Day"},{m:12,d:25,name:"Christmas Day"},{m:12,d:26,name:"Boxing Day"}]},
  IN:{flag:"🇮🇳", name:"India", weekend:[0], list:[{m:1,d:26,name:"Republic Day"},{m:8,d:15,name:"Independence Day"},{m:10,d:2,name:"Gandhi Jayanti"}]},
  PK:{flag:"🇵🇰", name:"Pakistan", weekend:[0], list:[{m:3,d:23,name:"Pakistan Day"},{m:8,d:14,name:"Independence Day"},{m:12,d:25,name:"Quaid-e-Azam Day"}]},
  SA:{flag:"🇸🇦", name:"Saudi Arabia", weekend:[5,6], list:[{m:9,d:23,name:"Saudi National Day"}]},
  AE:{flag:"🇦🇪", name:"UAE", weekend:[5,6], list:[{m:12,d:2,name:"National Day"}]},
  MY:{flag:"🇲🇾", name:"Malaysia", weekend:[5,6], list:[{m:8,d:31,name:"Merdeka Day"}]},
  ID:{flag:"🇮🇩", name:"Indonesia", weekend:[0], list:[{m:8,d:17,name:"Independence Day"}]},
  FR:{flag:"🇫🇷", name:"France", weekend:[0,6], list:[{m:7,d:14,name:"Bastille Day"},{m:12,d:25,name:"Christmas Day"}]},
  DE:{flag:"🇩🇪", name:"Germany", weekend:[0,6], list:[{m:10,d:3,name:"German Unity Day"},{m:12,d:25,name:"Christmas Day"}]},
  ES:{flag:"🇪🇸", name:"Spain", weekend:[0,6], list:[{m:10,d:12,name:"National Day"},{m:12,d:25,name:"Christmas Day"}]},
  CN:{flag:"🇨🇳", name:"China", weekend:[0,6], list:[{m:10,d:1,name:"National Day"},{m:1,d:1,name:"New Year's Day"}]},
  RU:{flag:"🇷🇺", name:"Russia", weekend:[0,6], list:[{m:1,d:1,name:"New Year's Day"},{m:5,d:9,name:"Victory Day"}]},
  TR:{flag:"🇹🇷", name:"Turkey", weekend:[0,6], list:[{m:10,d:29,name:"Republic Day"}]},
  EG:{flag:"🇪🇬", name:"Egypt", weekend:[5,6], list:[{m:7,d:23,name:"Revolution Day"}]},
  NG:{flag:"🇳🇬", name:"Nigeria", weekend:[0,6], list:[{m:10,d:1,name:"Independence Day"}]},
  BR:{flag:"🇧🇷", name:"Brazil", weekend:[0,6], list:[{m:9,d:7,name:"Independence Day"},{m:12,d:25,name:"Christmas Day"}]},
  CA:{flag:"🇨🇦", name:"Canada", weekend:[0,6], list:[{m:7,d:1,name:"Canada Day"},{m:12,d:25,name:"Christmas Day"}]},
  AU:{flag:"🇦🇺", name:"Australia", weekend:[0,6], list:[{m:1,d:26,name:"Australia Day"},{m:12,d:25,name:"Christmas Day"}]},
  JP:{flag:"🇯🇵", name:"Japan", weekend:[0,6], list:[{m:2,d:11,name:"National Foundation Day"},{m:5,d:3,name:"Constitution Day"}]},
  BD:{flag:"🇧🇩", name:"Bangladesh", weekend:[5,6], list:BD_FIXED},
};
const ALL_COUNTRIES = Object.entries(WORLD_HOLIDAYS).map(([code,v])=>({code, name:v.name, flag:v.flag}))
  .sort((a,b)=> a.name.localeCompare(b.name));

/* ============================================================
   4b. LIVE HOLIDAY SOURCE
   When the app is opened online, it asks a public holiday
   directory (date.nager.at, a free community-maintained holiday
   database covering ~100 countries) for that country/year's real
   holidays, and uses that instead of the bundled sample list.
   If the device is offline, or the chosen country isn't in that
   directory, the app falls back to the bundled data above —
   quietly, with a small status badge showing which one is active.
   ============================================================ */
const LIVE_API = "https://date.nager.at/api/v3";
async function fetchLiveCountries(){
  try{
    const res = await fetch(`${LIVE_API}/AvailableCountries`);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    return data.map(c=>({code:c.countryCode, name:c.name, flag:"🌐"}));
  }catch(e){ return null; }
}
async function fetchLiveHolidays(year, code){
  try{
    const res = await fetch(`${LIVE_API}/PublicHolidays/${year}/${code}`);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    return data.map(h=>{
      const d = new Date(h.date+"T00:00:00");
      return {m:d.getMonth()+1, d:d.getDate(), name:h.localName || h.name, type:"national"};
    });
  }catch(e){ return null; }
}

/* ============================================================
   5. WEEKDAY / MONTH NAME HELPERS
   ============================================================ */
const WD_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }

/* ============================================================
   6. MAIN APP
   ============================================================ */
function App(){
  const today = new Date();
  const [lang, setLang] = useState("en");
  const [country, setCountry] = useState("BD");
  const [tab, setTab] = useState("month");
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [countryQuery, setCountryQuery] = useState("");
  const [showResults, setShowResults] = useState(false);
  const [liveCountries, setLiveCountries] = useState(null); // full ~100-country list from the live API, once fetched
  const [holidayCache, setHolidayCache] = useState({}); // key "CODE-YEAR" -> holiday array from the live API
  const [liveStatus, setLiveStatus] = useState("loading"); // "loading" | "live" | "offline"
  const t = LANGS[lang];
  const isRtl = lang==="ar" || lang==="ur";

  const countryInfo = WORLD_HOLIDAYS[country];
  const isBangladesh = country==="BD";

  const yearOptions = useMemo(()=>{
    const arr=[]; for(let y=2014;y<=2060;y++) arr.push(y); return arr;
  },[]);

  // Fetch the full live country directory once, on first load (silently falls back if offline).
  useEffect(()=>{
    let cancelled=false;
    fetchLiveCountries().then(list=>{
      if(!cancelled && list && list.length) setLiveCountries(list);
    });
    return ()=>{cancelled=true;};
  },[]);

  // Fetch live holidays whenever the selected country or year changes.
  useEffect(()=>{
    let cancelled=false;
    const key = country+"-"+viewYear;
    if(holidayCache[key]){ setLiveStatus("live"); return; }
    setLiveStatus("loading");
    fetchLiveHolidays(viewYear, country).then(list=>{
      if(cancelled) return;
      if(list && list.length){
        setHolidayCache(prev=>({...prev, [key]: list}));
        setLiveStatus("live");
      } else {
        setLiveStatus("offline");
      }
    });
    return ()=>{cancelled=true;};
  },[country, viewYear]);

  const countryDirectory = liveCountries || ALL_COUNTRIES;
  const filteredCountries = useMemo(()=>{
    const q = countryQuery.trim().toLowerCase();
    const src = countryDirectory;
    if(!q) return src.slice(0,60);
    return src.filter(c=> c.name.toLowerCase().includes(q)).slice(0,60);
  },[countryQuery, countryDirectory]);

  // Merge: live-fetched holidays take priority; bundled sample data fills in when offline/unsupported.
  function getHolidaysForYear(y){
    const key = country+"-"+y;
    const live = holidayCache[key] || null;
    if(isBangladesh){
      const base = getBdHolidaysForYear(y);
      if(live){
        const extra = live.filter(lh => !base.some(b=> b.m===lh.m && b.d===lh.d));
        return [...base, ...extra.map(h=>({...h, y}))].sort((a,b)=> a.m-b.m || a.d-b.d);
      }
      return base;
    }
    if(live) return live.map(h=>({...h, y})).sort((a,b)=> a.m-b.m || a.d-b.d);
    if(countryInfo) return countryInfo.list.map(h=>({...h, type:"national", y})).sort((a,b)=> a.m-b.m || a.d-b.d);
    return [];
  }

  function holidayMapForMonth(y,m){
    const map = {};
    getHolidaysForYear(y).filter(h=>h.m===m+1).forEach(h=>{ map[h.d] = h; });
    return map;
  }

  function isWeekend(dateObj){
    const wd = dateObj.getDay();
    if(isBangladesh) return wd===5 || wd===6;
    if(countryInfo) return countryInfo.weekend.includes(wd);
    return wd===0 || wd===6;
  }

  function changeMonth(delta){
    let m = viewMonth+delta, y = viewYear;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    if(y<2014) {y=2014; m=0;} if(y>2060){y=2060; m=11;}
    setViewMonth(m); setViewYear(y);
  }

  /* Build calendar grid cells (Sun-start) */
  const gridCells = useMemo(()=>{
    const first = new Date(viewYear, viewMonth, 1);
    const startOffset = first.getDay(); // 0=Sun
    const totalDays = daysInMonth(viewYear, viewMonth);
    const prevDays = daysInMonth(viewYear, viewMonth===0?11:viewMonth-1);
    const cells = [];
    for(let i=0;i<startOffset;i++){
      cells.push({out:true, day: prevDays-startOffset+1+i});
    }
    const holMap = holidayMapForMonth(viewYear, viewMonth);
    for(let d=1; d<=totalDays; d++){
      const dateObj = new Date(viewYear, viewMonth, d);
      cells.push({
        out:false, day:d, dateObj,
        holiday: holMap[d]||null,
        weekend: isWeekend(dateObj),
        isToday: dateObj.toDateString()===today.toDateString(),
        bn: isBangladesh ? gregorianToBengali(dateObj) : null,
        hi: isBangladesh ? gregorianToHijri(dateObj) : null,
      });
    }
    while(cells.length % 7 !== 0 || cells.length<42){
      const nd = cells.length - (startOffset+totalDays) + 1;
      cells.push({out:true, day: nd});
      if(cells.length>=42) break;
    }
    return cells;
  },[viewYear, viewMonth, country, holidayCache]);

  const monthHolidays = useMemo(()=> getHolidaysForYear(viewYear).filter(h=>h.m===viewMonth+1)
  ,[viewYear, viewMonth, country, holidayCache]);

  const yearHolidays = useMemo(()=> getHolidaysForYear(viewYear)
  ,[viewYear, country, holidayCache]);

  return (
    <div className="app" dir={isRtl?"rtl":"ltr"}>
      <header className="top">
        <div className="brand">
          <div className="moon-badge" aria-hidden="true">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="moonGrad" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stopColor="#fdf1c8"/>
                  <stop offset="55%" stopColor="#e8b854"/>
                  <stop offset="100%" stopColor="#a5731f"/>
                </radialGradient>
              </defs>
              <circle cx="50" cy="50" r="38" fill="url(#moonGrad)"/>
              <circle cx="65" cy="37" r="33" fill="#0a0f1e"/>
              <circle cx="79" cy="19" r="2.4" fill="#fdf1c8"/>
              <circle cx="88" cy="33" r="1.4" fill="#fdf1c8"/>
              <circle cx="70" cy="10" r="1.2" fill="#fdf1c8"/>
            </svg>
          </div>
          <div className="brand-text">
            <div className="rb">RB</div>
            <div className="by">By Rafsan</div>
            <div className="tagline">Gregorian · Bengali · Hijri — one calendar, every country</div>
          </div>
        </div>
        <div className="top-controls">
          <div className="search-wrap">
            <input type="text" placeholder={t.searchCountry} value={countryQuery}
              onChange={e=>{setCountryQuery(e.target.value); setShowResults(true);}}
              onFocus={()=>setShowResults(true)}
              onBlur={()=>setTimeout(()=>setShowResults(false),150)}
              style={{width:220}}/>
            {showResults && (
              <div className="search-results">
                {filteredCountries.map(c=>(
                  <div key={c.code} onMouseDown={()=>{setCountry(c.code); setCountryQuery(""); setShowResults(false);}}>
                    {c.flag} {c.name}
                  </div>
                ))}
              </div>
            )}
          </div>
          <select value={lang} onChange={e=>setLang(e.target.value)} aria-label={t.selectLang}>
            {Object.entries(LANGS).map(([code,l])=> <option key={code} value={code}>{l.name}</option>)}
          </select>
        </div>
      </header>

      <div className="live-badge">
        {liveStatus==="loading" && <span>🔄 checking for live holiday data…</span>}
        {liveStatus==="live" && <span className="on">● live holiday data (date.nager.at)</span>}
        {liveStatus==="offline" && <span className="off">● offline / bundled sample data{isBangladesh?" (Bangladesh dataset)":""}</span>}
      </div>

      <nav className="tabs">
        <button className={tab==="month"?"active":""} onClick={()=>setTab("month")}>{t.month}</button>
        <button className={tab==="holidays"?"active":""} onClick={()=>setTab("holidays")}>{t.holidays}</button>
        <button className={tab==="world"?"active":""} onClick={()=>setTab("world")}>{t.world}</button>
      </nav>

      {tab==="month" && (
        <div className="panel">
          <div className="cal-controls">
            <div className="month-nav">
              <button onClick={()=>changeMonth(-1)} aria-label="Previous month">‹</button>
              <div>
                <div className="month-title">{MONTH_NAMES[viewMonth]} {viewYear}</div>
                {isBangladesh && (
                  <div className="sub-date-line">
                    {BN_MONTHS[gregorianToBengali(new Date(viewYear,viewMonth,15)).monthIndex]} {gregorianToBengali(new Date(viewYear,viewMonth,15)).year} BS
                    &nbsp;·&nbsp;
                    {HIJRI_MONTHS[gregorianToHijri(new Date(viewYear,viewMonth,15)).monthIndex]} {gregorianToHijri(new Date(viewYear,viewMonth,15)).year} AH
                  </div>
                )}
              </div>
              <button onClick={()=>changeMonth(1)} aria-label="Next month">›</button>
            </div>
            <select value={viewYear} onChange={e=>setViewYear(+e.target.value)} aria-label={t.selectYear}>
              {yearOptions.map(y=> <option key={y} value={y}>{y}</option>)}
            </select>
          </div>

          {isBangladesh && (
            <div className="legend" style={{marginBottom:12}}>
              <span><span className="dot bn"></span>Bengali (BS)</span>
              <span><span className="dot ar"></span>Hijri (AH)</span>
              <span><span className="dot hol"></span>{t.holidays}</span>
              <span style={{opacity:.7}}>{t.approxNote}</span>
            </div>
          )}
          {!isBangladesh && liveStatus==="offline" && !countryInfo && <div className="note">{t.noData}</div>}

          <div className="grid">
            {WD_SHORT.map((w,i)=>(
              <div key={w} className={"wd "+((isBangladesh? (i===5||i===6) : (countryInfo? countryInfo.weekend.includes(i): (i===0||i===6))) ? "weekend":"")}>{w}</div>
            ))}
            {gridCells.map((c,idx)=>(
              <div key={idx} className={"cell "+(c.out?"out ":"")+(c.isToday?"today":"")}>
                {!c.out && (
                  <React.Fragment>
                    <div className={"g-num "+((c.holiday||c.weekend)?"holiday":"")}>{c.day}</div>
                    {isBangladesh && (
                      <div className="sub-nums">
                        <span className="bn">{toBnDigits(c.bn.day)}</span>
                        <span className="ar">{c.hi.day}</span>
                      </div>
                    )}
                    {c.holiday && <span className="hol-name">{c.holiday.name}</span>}
                  </React.Fragment>
                )}
                {c.out && <div className="g-num" style={{fontSize:13}}>{c.day}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==="holidays" && (
        <div className="panel">
          <div className="cal-controls">
            <div className="month-title">{MONTH_NAMES[viewMonth]} {viewYear} — {t.holidays}</div>
            <select value={viewYear} onChange={e=>setViewYear(+e.target.value)}>
              {yearOptions.map(y=> <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div className="hol-list">
            {yearHolidays.length===0 && <div className="note">{t.noData}</div>}
            {yearHolidays.map((h,i)=>(
              <div className="hol-row" key={i}>
                <div className="hol-date">{h.d} {MONTH_NAMES[h.m-1]}</div>
                <div style={{flex:1}}>{h.name}</div>
                <div className={"hol-tag "+h.type}>{t[h.type]||h.type}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==="world" && (
        <div className="panel">
          <div className="month-title" style={{marginBottom:16}}>{t.world}</div>
          <div className="world-grid">
            {Object.entries(WORLD_HOLIDAYS).map(([code,c])=>(
              <div className="country-card" key={code}>
                <h4>{c.flag} {c.name}</h4>
                <ul>
                  {(code==="BD"? getBdHolidaysForYear(viewYear) : c.list).slice(0,8).map((h,i)=>(
                    <li key={i}>{h.d} {MONTH_NAMES[h.m-1]} — {h.name}</li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      )}

      <footer>
        RB Calendar — designed &amp; built for GitHub Pages / PWA install. Years 2014–2060 supported.<br/>
        Bengali date uses the reformed Bangladeshi solar calendar (algorithmic, Pohela Boishakh fixed to 14 April). Hijri date uses the standard tabular Islamic calendar — both are close approximations; real religious holidays remain subject to moon sighting.<br/>
        🌙 <b>By Rafsan</b>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
