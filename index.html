<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB - Universal Calendar</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spaceBg: '#0b0f19',
                        cardBg: '#111827',
                        accentGold: '#f59e0b',
                        bnBlue: '#3b82f6',
                        arGreen: '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e1b4b, #090d16);
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- Header Section -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 bg-slate-900/80 p-4 rounded-xl border border-slate-800 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="text-4xl text-amber-400">🌙</div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-wider text-amber-400">RB</h1>
                <p class="text-xs font-semibold tracking-widest text-slate-400 uppercase">By Rafsan</p>
            </div>
        </div>

        <!-- Language & Country Controls -->
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
            <div class="flex-1 sm:flex-none">
                <input type="text" id="countrySearch" placeholder="Search Country..." list="countriesList" class="w-full bg-slate-800 text-sm border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-400" onchange="changeCountry(this.value)">
                <datalist id="countriesList">
                    <option value="BD">Bangladesh</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="IN">India</option>
                    <option value="SA">Saudi Arabia</option>
                    <option value="AE">UAE</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="JP">Japan</option>
                    <option value="DE">Germany</option>
                </datalist>
            </div>

            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 text-sm border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-amber-400">
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="es">Español</option>
                <option value="hi">हिन्दी</option>
                <option value="ar">العربية</option>
                <option value="fa">ফার্সী (Persian)</option>
                <option value="fr">Français</option>
                <option value="zh">中文</option>
                <option value="ru">Русский</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
            </select>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-2xl">
        
        <!-- Controls & Navigation -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-2">
                <button onclick="prevMonth()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700">❮</button>
                <h2 id="monthYearText" class="text-xl font-bold min-w-[180px] text-center">August 2026</h2>
                <button onclick="nextMonth()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700">❯</button>
            </div>

            <div class="flex items-center gap-3">
                <select id="yearSelect" onchange="selectYear(this.value)" class="bg-slate-800 text-sm border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200">
                    <!-- Years 2014 to 2060 will be generated -->
                </select>

                <!-- Navigation Tabs -->
                <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                    <button id="btnMonth" onclick="switchView('month')" class="px-3 py-1 text-xs rounded-md bg-amber-500 text-slate-950 font-bold">Month</button>
                    <button id="btnHolidays" onclick="switchView('holidays')" class="px-3 py-1 text-xs rounded-md text-slate-300 hover:text-white">Annual Holidays Chart</button>
                </div>
            </div>
        </div>

        <!-- Legend (Bangladesh Multi-Calendar Info) -->
        <div id="bdLegend" class="flex flex-wrap gap-4 text-xs mb-4 p-2 bg-slate-800/50 rounded-lg border border-slate-800">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-200"></span> <span id="lblGreg">Gregorian</span></span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-400"></span> <span id="lblBn">Bengali (BS)</span></span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span id="lblAr">Hijri (AH)</span></span>
            <span class="text-slate-400 ml-auto">* Islamic dates subject to moon sighting</span>
        </div>

        <!-- Calendar Month View -->
        <div id="monthView">
            <div class="calendar-grid text-center font-semibold text-slate-400 text-xs py-2 border-b border-slate-800 mb-2">
                <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
            </div>
            <div id="daysGrid" class="calendar-grid gap-1 md:gap-2">
                <!-- Days rendered dynamically -->
            </div>
        </div>

        <!-- Annual Holidays View -->
        <div id="holidaysView" class="hidden">
            <h3 class="text-lg font-bold mb-4 text-amber-400" id="holidayTitle">Annual National Holidays</h3>
            <div id="holidaysList" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                <!-- Holidays loaded dynamically -->
            </div>
        </div>
    </main>

    <script>
        // App State
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let currentCountry = 'BD';
        let currentLang = 'en';
        let viewMode = 'month';
        let holidaysData = {};

        // Translation Dictionary
        const translations = {
            en: { Gregorian: "Gregorian", Bengali: "Bengali (BS)", Hijri: "Hijri (AH)", Month: "Month", Holidays: "Annual Holidays Chart", Title: "Annual National Holidays" },
            bn: { Gregorian: "ইংরেজি", Bengali: "বাংলা", Hijri: "হিজরী", Month: "মাসিক", Holidays: "বার্ষিক ছুটির তালিকা", Title: "বছরের সকল সরকারি ছুটি" },
            es: { Gregorian: "Gregoriano", Bengali: "Bengalí", Hijri: "Hijri", Month: "Mes", Holidays: "Tabla de Vacaciones", Title: "Días Festivos Nacionales" },
            hi: { Gregorian: "গ্রেগরিয়ান", Bengali: "बंगाली", Hijri: "हिजरी", Month: "महीना", Holidays: "वार्षिक छुट्टियां", Title: "वार्षिक राष्ट्रीय छुट्टियां" },
            ar: { Gregorian: "ميلادي", Bengali: "بنغالي", Hijri: "هجري", Month: "شهر", Holidays: "جدول العطلات", Title: "العطل الرسمية السنوية" },
            fa: { Gregorian: "میلادی", Bengali: "بنگالی", Hijri: "هجری", Month: "ماه", Holidays: "جدول تعطیلات", Title: "تعطیلات رسمی سالانه" },
            fr: { Gregorian: "Grégorien", Bengali: "Bengali", Hijri: "Hégirien", Month: "Mois", Holidays: "Tableau des Vacances", Title: "Jours Fériés Nationaux" },
            zh: { Gregorian: "公历", Bengali: "孟加拉历", Hijri: "回历", Month: "月", Holidays: "年度假期表", Title: "年度法定节假日" },
            ru: { Gregorian: "Григорианский", Bengali: "Бенгальский", Hijri: "Хиджра", Month: "Месяц", Holidays: "Календарь Праздников", Title: "Ежегодные Праздники" },
            de: { Gregorian: "Gregorianisch", Bengali: "Bengalisch", Hijri: "Hidschri", Month: "Monat", Holidays: "Feiertagstabelle", Title: "Jährliche Feiertage" },
            pt: { Gregorian: "Gregoriano", Bengali: "Bengali", Hijri: "Hijri", Month: "Mês", Holidays: "Tabela de Feriados", Title: "Feriados Nacionais" }
        };

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        // Init App
        window.onload = () => {
            populateYears();
            fetchHolidays();
            renderCalendar();
        };

        function populateYears() {
            const select = document.getElementById('yearSelect');
            for (let y = 2014; y <= 2060; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                select.appendChild(opt);
            }
        }

        async function fetchHolidays() {
            try {
                const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/${currentCountry}`);
                if (response.ok) {
                    const data = await response.json();
                    holidaysData = {};
                    data.forEach(h => { holidaysData[h.date] = h.localName || h.name; });
                }
            } catch (e) {
                console.log("Offline mode or API limit reached");
            }
            renderCalendar();
            renderHolidaysChart();
        }

        function renderCalendar() {
            document.getElementById('monthYearText').textContent = `${monthNames[currentMonth]} ${currentYear}`;
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Blank spaces for offset
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            const today = new Date();

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day;
                const isHoliday = holidaysData[dateStr];

                const dayCard = document.createElement('div');
                dayCard.className = `min-h-[75px] p-1.5 rounded-lg border text-left flex flex-col justify-between transition ${
                    isToday ? 'border-amber-400 bg-amber-500/10' : 'border-slate-800 bg-slate-800/40'
                } ${isHoliday ? 'border-red-500/50 bg-red-500/5' : ''}`;

                // Main Gregorian Date
                let content = `<div class="flex justify-between items-start">
                    <span class="font-bold text-base ${isHoliday ? 'text-red-400' : 'text-slate-100'}">${day}</span>`;

                // Sub-dates (Bengali & Arabic) only for Bangladesh context
                if (currentCountry === 'BD') {
                    // Approximate calculations for display
                    const bnDay = (day + 16) % 30 || 30;
                    const arDay = (day + 5) % 30 || 30;
                    content += `<div class="text-[10px] space-x-1">
                        <span class="text-blue-400 font-semibold">${bnDay}</span>
                        <span class="text-emerald-400 font-semibold">${arDay}</span>
                    </div>`;
                }
                content += `</div>`;

                if (isHoliday) {
                    content += `<div class="text-[9px] text-red-400 font-medium truncate mt-1">${isHoliday}</div>`;
                }

                dayCard.innerHTML = content;
                grid.appendChild(dayCard);
            }
        }

        function renderHolidaysChart() {
            const list = document.getElementById('holidaysList');
            list.innerHTML = '';

            const dates = Object.keys(holidaysData).sort();
            if (dates.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-sm">No holiday data found or working offline.</p>`;
                return;
            }

            dates.forEach(d => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 bg-slate-800/60 border border-slate-700/50 rounded-lg text-sm";
                item.innerHTML = `
                    <span class="font-semibold text-slate-300">${d}</span>
                    <span class="text-amber-400 font-medium">${holidaysData[d]}</span>
                `;
                list.appendChild(item);
            });
        }

        // Actions & Event Listeners
        function prevMonth() {
            if (currentMonth === 0) { currentMonth = 11; currentYear--; } else { currentMonth--; }
            document.getElementById('yearSelect').value = currentYear;
            renderCalendar();
        }

        function nextMonth() {
            if (currentMonth === 11) { currentMonth = 0; currentYear++; } else { currentMonth++; }
            document.getElementById('yearSelect').value = currentYear;
            renderCalendar();
        }

        function selectYear(yr) {
            currentYear = parseInt(yr);
            fetchHolidays();
        }

        function changeCountry(code) {
            if (code && code.length === 2) {
                currentCountry = code.toUpperCase();
                document.getElementById('bdLegend').style.display = (currentCountry === 'BD') ? 'flex' : 'none';
                fetchHolidays();
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations['en'];
            document.getElementById('lblGreg').textContent = t.Gregorian;
            document.getElementById('lblBn').textContent = t.Bengali;
            document.getElementById('lblAr').textContent = t.Hijri;
            document.getElementById('btnMonth').textContent = t.Month;
            document.getElementById('btnHolidays').textContent = t.Holidays;
            document.getElementById('holidayTitle').textContent = t.Title;
        }

        function switchView(mode) {
            viewMode = mode;
            if (mode === 'month') {
                document.getElementById('monthView').classList.remove('hidden');
                document.getElementById('holidaysView').classList.add('hidden');
                document.getElementById('btnMonth').className = "px-3 py-1 text-xs rounded-md bg-amber-500 text-slate-950 font-bold";
                document.getElementById('btnHolidays').className = "px-3 py-1 text-xs rounded-md text-slate-300 hover:text-white";
            } else {
                document.getElementById('monthView').classList.add('hidden');
                document.getElementById('holidaysView').classList.remove('hidden');
                document.getElementById('btnHolidays').className = "px-3 py-1 text-xs rounded-md bg-amber-500 text-slate-950 font-bold";
                document.getElementById('btnMonth').className = "px-3 py-1 text-xs rounded-md text-slate-300 hover:text-white";
            }
        }
    </script>
</body>
</html>
