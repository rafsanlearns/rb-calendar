<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB - Universal Calendar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amberCustom: '#fbbf24',
                        bnBlue: '#60a5fa',
                        arGreen: '#34d399'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(251, 191, 36, 0.3);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="p-3 md:p-8 flex flex-col items-center justify-center relative overflow-x-hidden">

    <!-- Background Glows -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Section -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 glass-panel p-4 rounded-2xl relative z-10">
        <div class="flex items-center gap-3">
            <div class="text-4xl filter drop-shadow-[0_0_10px_rgba(251,191,36,0.5)]">🌙</div>
            <div>
                <h1 class="text-3xl font-black tracking-wider text-amberCustom drop-shadow">RB</h1>
                <p class="text-[10px] font-bold tracking-[0.2em] text-slate-400 uppercase">By Rafsan</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
            <div class="flex-1 sm:flex-none">
                <input type="text" id="countrySearch" placeholder="Search Country..." list="countriesList" class="w-full bg-slate-900/80 text-sm border border-slate-700/60 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amberCustom transition" onchange="changeCountry(this.value)">
                <datalist id="countriesList">
                    <option value="BD">Bangladesh</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="IN">India</option>
                    <option value="SA">Saudi Arabia</option>
                    <option value="AE">UAE</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="JP">Japan</option>
                    <option value="DE">Germany</option>
                </datalist>
            </div>

            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-900/80 text-sm border border-slate-700/60 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-amberCustom transition cursor-pointer">
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="es">Español</option>
                <option value="hi">हिन्दी</option>
                <option value="ar">العربية</option>
                <option value="fa">ফার্সী</option>
                <option value="fr">Français</option>
                <option value="zh">中文</option>
                <option value="ru">Русский</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
            </select>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-4 md:p-6 relative z-10">
        
        <!-- Controls & Navigation -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-3">
                <button onclick="prevMonth()" class="w-9 h-9 flex items-center justify-center bg-slate-800/80 hover:bg-amberCustom hover:text-slate-950 rounded-xl border border-slate-700/50 transition font-bold">❮</button>
                <h2 id="monthYearText" class="text-xl font-extrabold min-w-[180px] text-center tracking-wide text-slate-100">August 2026</h2>
                <button onclick="nextMonth()" class="w-9 h-9 flex items-center justify-center bg-slate-800/80 hover:bg-amberCustom hover:text-slate-950 rounded-xl border border-slate-700/50 transition font-bold">❯</button>
            </div>

            <div class="flex items-center gap-3">
                <select id="yearSelect" onchange="selectYear(this.value)" class="bg-slate-900/80 text-sm border border-slate-700/60 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-amberCustom transition cursor-pointer">
                </select>

                <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                    <button id="btnMonth" onclick="switchView('month')" class="px-3 py-1.5 text-xs rounded-lg bg-amberCustom text-slate-950 font-bold transition">Month</button>
                    <button id="btnHolidays" onclick="switchView('holidays')" class="px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:text-white transition">Annual Holidays</button>
                </div>
            </div>
        </div>

        <!-- Legend -->
        <div id="bdLegend" class="flex flex-wrap gap-4 text-xs mb-4 p-2.5 bg-slate-900/40 rounded-xl border border-slate-800/60">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-slate-200"></span> <span id="lblGreg">Gregorian</span></span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-400"></span> <span id="lblBn">Bengali (BS)</span></span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span id="lblAr">Hijri (AH)</span></span>
            <span id="lblMoon" class="text-slate-400 ml-auto italic">* Moon sighting dependent</span>
        </div>

        <!-- Calendar Month View -->
        <div id="monthView">
            <div id="weekDaysHeader" class="calendar-grid text-center font-bold text-slate-400 text-xs py-2 border-b border-slate-800/80 mb-3">
                <!-- Days of week rendered dynamically -->
            </div>
            <div id="daysGrid" class="calendar-grid gap-1.5 md:gap-2.5">
            </div>
        </div>

        <!-- Annual Holidays View -->
        <div id="holidaysView" class="hidden">
            <h3 class="text-lg font-bold mb-4 text-amberCustom" id="holidayTitle">Annual National Holidays</h3>
            <div id="holidaysList" class="space-y-2.5 max-h-[480px] overflow-y-auto pr-2">
            </div>
        </div>
    </main>

    <script>
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let currentCountry = 'BD';
        let currentLang = 'en';
        let holidaysData = {};

        // Multilingual Dictionary
        const i18n = {
            en: {
                greg: "Gregorian", bn: "Bengali (BS)", ar: "Hijri (AH)", month: "Month", holidays: "Annual Holidays",
                title: "Annual National Holidays", moon: "* Moon sighting dependent",
                searchPlaceholder: "Search Country...", noData: "No holiday data available or working offline.",
                days: ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"],
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
            },
            bn: {
                greg: "ইংরেজি", bn: "বাংলা (ব.সং)", ar: "হিজরী (হি.সং)", month: "মাসিক", holidays: "বার্ষিক ছুটি",
                title: "বছরের সকল সরকারি ছুটি", moon: "* চাঁদ দেখার উপর নির্ভরশীল",
                searchPlaceholder: "দেশ অনুসন্ধান করুন...", noData: "ছুটির কোনো তথ্য পাওয়া যায়নি অথবা অফলাইনে আছেন।",
                days: ["রবি", "সোম", "মঙ্গল", "বুধ", "বৃহঃ", "শুক্র", "শনি"],
                months: ["জানুয়ারী", "ফেব্রুয়ারী", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"]
            },
            es: {
                greg: "Gregoriano", bn: "Bengalí", ar: "Hijri", month: "Mes", holidays: "Vacaciones",
                title: "Días Festivos Nacionales", moon: "* Sujeto al avistamiento de la luna",
                searchPlaceholder: "Buscar país...", noData: "No hay datos de vacaciones disponibles.",
                days: ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"],
                months: ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"]
            },
            hi: {
                greg: "গ্রেগরিয়ান", bn: "बंगाली", ar: "हिजरी", month: "महीना", holidays: "वार्षिक छुट्टियां",
                title: "वार्षिक राष्ट्रीय छुट्टियां", moon: "* चांद देखने पर निर्भर",
                searchPlaceholder: "देश खोजें...", noData: "कोई छुट्टी का डेटा उपलब्ध नहीं है।",
                days: ["रवि", "सोम", "मंगल", "बुध", "गुरु", "शुक्र", "शनि"],
                months: ["जनवरी", "फरवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"]
            },
            ar: {
                greg: "ميلادي", bn: "بنغالي", ar: "هجري", month: "شهر", holidays: "العطلات",
                title: "العطل الرسمية السنوية", moon: "* يعتمد على رؤية الهلال",
                searchPlaceholder: "ابحث عن دولة...", noData: "لا توجد بيانات عطلات متاحة.",
                days: ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"],
                months: ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"]
            }
        };

        window.onload = () => {
            populateYears();
            fetchHolidays();
        };

        function populateYears() {
            const select = document.getElementById('yearSelect');
            for (let y = 2014; y <= 2060; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                select.appendChild(opt);
            }
        }

        // Live Holiday API Fetching
        async function fetchHolidays() {
            try {
                const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/${currentCountry}`);
                if (response.ok) {
                    const data = await response.json();
                    holidaysData = {};
                    data.forEach(h => { holidaysData[h.date] = h.localName || h.name; });
                }
            } catch (e) {
                console.log("Offline or API rate limit.");
            }
            renderCalendar();
            renderHolidaysChart();
        }

        function renderCalendar() {
            const langData = i18n[currentLang] || i18n['en'];

            // Month Year Dynamic Text
            document.getElementById('monthYearText').textContent = `${langData.months[currentMonth]} ${currentYear}`;
            
            // Days of week header
            const headerGrid = document.getElementById('weekDaysHeader');
            headerGrid.innerHTML = '';
            langData.days.forEach((day, index) => {
                const dayEl = document.createElement('div');
                dayEl.textContent = day;
                if (index === 5) dayEl.className = "text-amberCustom"; // Friday Highlight
                headerGrid.appendChild(dayEl);
            });

            // Days Grid
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            const today = new Date();

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day;
                const isHoliday = holidaysData[dateStr];

                const dayCard = document.createElement('div');
                dayCard.className = `min-h-[80px] p-2 rounded-xl text-left flex flex-col justify-between transition glass-card ${
                    isToday ? 'ring-2 ring-amberCustom bg-amberCustom/10' : ''
                } ${isHoliday ? 'border-red-500/40 bg-red-500/5' : ''}`;

                let content = `<div class="flex justify-between items-start">
                    <span class="font-extrabold text-base ${isHoliday ? 'text-red-400' : 'text-slate-100'}">${day}</span>`;

                if (currentCountry === 'BD') {
                    const bnDay = (day + 16) % 30 || 30;
                    const arDay = (day + 5) % 30 || 30;
                    content += `<div class="text-[10px] space-x-1 font-semibold">
                        <span class="text-blue-400">${bnDay}</span>
                        <span class="text-emerald-400">${arDay}</span>
                    </div>`;
                }
                content += `</div>`;

                if (isHoliday) {
                    content += `<div class="text-[9px] text-red-400 font-medium line-clamp-2 mt-1 leading-tight">${isHoliday}</div>`;
                }

                dayCard.innerHTML = content;
                grid.appendChild(dayCard);
            }
        }

        function renderHolidaysChart() {
            const list = document.getElementById('holidaysList');
            const langData = i18n[currentLang] || i18n['en'];
            list.innerHTML = '';

            const dates = Object.keys(holidaysData).sort();
            if (dates.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-sm">${langData.noData}</p>`;
                return;
            }

            dates.forEach(d => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3.5 glass-card rounded-xl text-sm";
                item.innerHTML = `
                    <span class="font-semibold text-slate-300">${d}</span>
                    <span class="text-amberCustom font-medium">${holidaysData[d]}</span>
                `;
                list.appendChild(item);
            });
        }

        function prevMonth() {
            if (currentMonth === 0) { currentMonth = 11; currentYear--; } else { currentMonth--; }
            document.getElementById('yearSelect').value = currentYear;
            renderCalendar();
        }

        function nextMonth() {
            if (currentMonth === 11) { currentMonth = 0; currentYear++; } else { currentMonth++; }
            document.getElementById('yearSelect').value = currentYear;
            renderCalendar();
        }

        function selectYear(yr) {
            currentYear = parseInt(yr);
            fetchHolidays();
        }

        function changeCountry(code) {
            if (code && code.length === 2) {
                currentCountry = code.toUpperCase();
                document.getElementById('bdLegend').style.display = (currentCountry === 'BD') ? 'flex' : 'none';
                fetchHolidays();
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang] || i18n['en'];
            document.getElementById('lblGreg').textContent = t.greg;
            document.getElementById('lblBn').textContent = t.bn;
            document.getElementById('lblAr').textContent = t.ar;
            document.getElementById('lblMoon').textContent = t.moon;
            document.getElementById('btnMonth').textContent = t.month;
            document.getElementById('btnHolidays').textContent = t.holidays;
            document.getElementById('holidayTitle').textContent = t.title;
            document.getElementById('countrySearch').placeholder = t.searchPlaceholder;
            renderCalendar();
            renderHolidaysChart();
        }

        function switchView(mode) {
            if (mode === 'month') {
                document.getElementById('monthView').classList.remove('hidden');
                document.getElementById('holidaysView').classList.add('hidden');
                document.getElementById('btnMonth').className = "px-3 py-1.5 text-xs rounded-lg bg-amberCustom text-slate-950 font-bold transition";
                document.getElementById('btnHolidays').className = "px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:text-white transition";
            } else {
                document.getElementById('monthView').classList.add('hidden');
                document.getElementById('holidaysView').classList.remove('hidden');
                document.getElementById('btnHolidays').className = "px-3 py-1.5 text-xs rounded-lg bg-amberCustom text-slate-950 font-bold transition";
                document.getElementById('btnMonth').className = "px-3 py-1.5 text-xs rounded-lg text-slate-300 hover:text-white transition";
            }
        }
    </script>
</body>
</html>
